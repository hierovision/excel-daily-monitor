<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel Daily Summary</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 1.15rem; }
  .nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .nav button, .nav input { font: inherit; padding: 6px 10px; border: 1px solid #ccc8; border-radius: 8px; background: transparent; min-height: 24px; }
  .nav button:disabled { opacity: .4; }
  .today-wrap { margin: 4px 0 0; }
  .today-strip { border: 1px solid #9ac9ec; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .today-strip h2 { margin: 0; font-size: 1.05rem; }
  .today-date { margin: 0; font-size: .9rem; }
  .today-status { margin: 2px 0 8px; }
  .today-wrap button, .today-strip button { font: inherit; padding: 6px 10px; border: 1px solid #ccc8; border-radius: 8px; background: transparent; min-height: 24px; }
  .week-band { border: 1px solid #ccc3; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .week-band h2 { margin: 0 0 6px; font-size: 1rem; }
  .week-band p { margin: 2px 0; font-size: .9rem; }
  .legend { color: #6b6b6b; font-size: .8rem; margin: 0 2px 10px; }
  .day { border: 1px solid #ccc3; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; min-width: 0; }
  .day summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 8px; min-height: 44px; }
  .day summary::-webkit-details-marker { display: none; }
  .day summary h3 { display: inline; margin: 0; font-size: 1rem; }
  .day-meta { font-size: .9rem; }
  .badge { display: inline-block; font-size: .75rem; border: 1px solid #9ac9ec; border-radius: 999px; padding: 1px 8px; color: #225566; }
  .chip { display: inline-block; font-size: .75rem; border: 1px solid #ccc8; border-radius: 999px; padding: 1px 8px; }
  .chip.today-chip { border-color: #9ac9ec; color: #225566; font-weight: 600; }
  .day-detail { margin-top: 6px; font-size: .88rem; }
  .day-date { margin: 0 0 4px; font-size: .8rem; }
  .metrics { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; margin: 6px 0; }
  .metrics dt { min-width: 0; }
  .metrics dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .metrics dd.hero { font-size: 1.05rem; font-weight: 600; }
  .courses-label { margin: 8px 0 2px; }
  .course-line { display: flex; justify-content: space-between; gap: 10px; margin: 2px 0; min-width: 0; }
  .course-line span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .course-line .course-time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .v1-note { margin: 2px 0 0; }
  .day.empty h3, .day.future h3 { display: inline; margin: 0; font-size: 1rem; }
  .day.empty, .day.future { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 8px; min-height: 44px; }
  .muted { color: #6b6b6b; font-size: .8rem; }
  ul { margin: 4px 0 0; padding-left: 18px; font-size: .85rem; }
  .stale { color: #8a4b00; font-size: .8rem; margin-top: 2px; }
  @media (prefers-color-scheme: dark) {
    .muted, .legend { color: #b0b0b0; }
    .stale { color: #e0a060; }
    .badge { color: #bcdcf5; border-color: #4a6b86; }
    .chip.today-chip { color: #bcdcf5; border-color: #4a6b86; }
  }
  @media (min-width: 1080px) {
    body { max-width: 1200px; display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 8px; }
    h1 { flex: 1 1 auto; margin: 0 0 12px; }
    .nav { flex: 0 0 auto; margin-bottom: 12px; flex-wrap: nowrap; }
    #days { flex: 1 1 100%; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: start; }
    .week-band, .legend, .stale, .today-strip { grid-column: 1 / -1; }
    .week-band { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 18px; }
    .week-band h2 { margin: 0 8px 0 0; }
    .legend { align-self: center; margin: 0 0 8px; }
    /* Desktop 7-track cards have a ~118px content box; the widest metric value
       (~119.5px at the hero size) cannot stay on one nowrap line inside it, so
       stack each pair and let only the overlong values wrap. */
    .metrics { grid-template-columns: minmax(0, 1fr); }
    .metrics dd { text-align: left; white-space: normal; margin-bottom: 6px; }
    .course-line { align-items: flex-end; }
    .today-status, [data-testid=sessions] summary { text-wrap: pretty; }
  }
</style>
</head>
<body>
<h1>Excel High School — Daily Activity</h1>
<nav class="nav" aria-label="Week navigation">
  <button type="button" data-testid="prev-week">← Prev week</button>
  <input type="date" data-testid="picker" aria-label="Show the 7 days ending on">
  <button type="button" data-testid="today-jump">Today</button>
  <button type="button" data-testid="next-week">Next week →</button>
</nav>
<div id="days"><p class="muted">Loading…</p></div>
<script>
"use strict";
const WINDOW_DAYS = 7;
const POLL_MS = 120000;
const state = {
  dates: [], anchor: null, minAnchor: null, maxAnchor: null, cache: new Map(),
  todayDay: null, todayDate: null, todaySnapshot: null, retrievedAt: null,
  todayStatus: "Loading today's activity…", refreshing: false,
};
let pollTimer = null;
const addDays = (date, n) => new Date(Date.parse(date + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10);
const weekStart = (date) => {
  const dow = new Date(Date.parse(date + "T00:00:00Z")).getUTCDay();
  return addDays(date, -((dow + 6) % 7));
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtMin = (m) => { const h = Math.floor(m / 60); return h > 0 ? `${h}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`; };
// OQ3 (Rev 2026-09-27d): quantize an estimated value to the nearest 5-minute
// bucket (ties round up); collapsed day lines carry the "≈" prefix. The band
// and the expanded detail keep their exact raw ranges; a true zero renders
// "0m" without the prefix.
const quantize5 = (m) => Math.round(m / 5) * 5;
const mid = (low, high) => quantize5((low + high) / 2);
const rangeValue = (low, high) => (low === high ? fmtMin(low) : `${fmtMin(low)}–${fmtMin(high)}`);
const pollMs = () => (typeof window.__pollMs === "number" && window.__pollMs > 0 ? window.__pollMs : POLL_MS);

function nowMs() {
  return typeof window.__now === "string" ? Date.parse(window.__now) : Date.now();
}
function etParts(ms) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date(ms));
}
function todayEt() {
  const part = (type) => { const p = etParts(nowMs()).find((x) => x.type === type); return p ? p.value : ""; };
  return `${part("year")}-${part("month")}-${part("day")}`;
}
function fmtEtDateTime(ms) {
  return new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true,
  }).format(new Date(ms));
}
async function fetchStatus() {
  try {
    const res = await fetch("data/status.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const parsed = await res.json();
    const ms = Date.parse(parsed && parsed.fetched_at);
    return Number.isFinite(ms) ? ms : null;
  } catch { return null; }
}
function retrievalText() {
  return state.retrievedAt === null
    ? "Retrieval time unavailable"
    : `Data last checked ${fmtEtDateTime(state.retrievedAt)} ET`;
}
function fmtWeekOf(date) {
  return new Intl.DateTimeFormat("en-US", { timeZone: "UTC", month: "short", day: "numeric" })
    .format(new Date(date + "T00:00:00Z"));
}
function fmtMonthDay(date) {
  return new Intl.DateTimeFormat("en-US", { timeZone: "UTC", month: "short", day: "numeric" })
    .format(new Date(date + "T00:00:00Z"));
}
// Week identity line: "Sep 14 – 20, 2026"; both months when the week crosses a
// month boundary; the year is always spelled out (Rev 2026-09-27, W4).
function fmtWeekRange(start, end) {
  const sMon = fmtMonthDay(start).split(" ")[0];
  const eMon = fmtMonthDay(end).split(" ")[0];
  const year = start.slice(0, 4);
  if (sMon === eMon) return `${sMon} ${Number(start.slice(8, 10))} – ${Number(end.slice(8, 10))}, ${year}`;
  return `${sMon} ${Number(start.slice(8, 10))} – ${eMon} ${Number(end.slice(8, 10))}, ${year}`;
}
const WEEKDAYS_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const WEEKDAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function dayOfWeek(date) {
  return new Date(Date.parse(date + "T00:00:00Z")).getUTCDay();
}
// Collapsed label "Mon 14" + accessible name "Monday, 2026-09-14" (W4).
function dayLabel(date) {
  return `${WEEKDAYS_SHORT[dayOfWeek(date)]} ${Number(date.slice(8, 10))}`;
}
function dayName(date) {
  return `${WEEKDAYS_FULL[dayOfWeek(date)]}, ${date}`;
}
// 12-hour display of the ET wall-clock strings carried by the day JSON
// (Rev 2026-09-27a, W12). Data untouched; formatting only.
function fmt12(t) {
  if (!t) return "—";
  const parts = String(t).split(":");
  const h = Number(parts[0]);
  const m = parts[1] || "00";
  if (!Number.isFinite(h)) return String(t);
  const meridiem = h < 12 ? "AM" : "PM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${m} ${meridiem}`;
}
function timeRange(a, b) {
  const at = fmt12(a);
  const bt = fmt12(b);
  const am = at.slice(-2);
  const bm = bt.slice(-2);
  if (am === bm) return `${at.slice(0, -3)}–${bt}`;
  return `${at}–${bt}`;
}

function dayStats(d) {
  if (typeof d.active_minutes_low === "number") {
    return { v2: true, low: d.active_minutes_low, high: d.active_minutes_high };
  }
  return { v2: false, low: d.estimated_active_minutes, high: d.estimated_active_minutes };
}
function coursesBlock(d, v2) {
  const courses = d.by_course || [];
  if (!courses.length) return "";
  const rows = courses.map((c) => `
    <p class="course-line" data-testid="course-line"><span>${esc(c.course)}</span> <span class="course-time">${fmtMin(v2 ? c.active_minutes_low : c.estimated_minutes)}</span></p>`).join("");
  return `<p class="courses-label muted">Courses</p><div data-testid="courses">${rows}</div>`;
}
function sessionsBlock(d) {
  const sessions = d.sessions || [];
  if (!sessions.length) return "";
  const first = d.first_activity_at ? String(d.first_activity_at).slice(0, 5) : "";
  const last = d.last_activity_at ? String(d.last_activity_at).slice(0, 5) : "";
  const span = first && last ? ` · ${timeRange(first, last)}` : "";
  const items = sessions.map((s) => `<li>${esc(timeRange(s.start, s.end))}</li>`).join("");
  return `<details data-testid="sessions"><summary>Sessions (${sessions.length})${span}</summary><ul>${items}</ul></details>`;
}
function subsBlock(d) {
  const subs = d.submissions_and_grades || [];
  if (!subs.length) return "";
  const items = subs.map((s) => `<li>${esc(s.course)} — ${esc(s.item)} · ${esc(fmt12(s.at))}</li>`).join("");
  if (subs.length <= 3) return `<ul data-testid="submissions">${items}</ul>`;
  return `<details data-testid="submissions"><summary>Submissions (${subs.length})</summary><ul>${items}</ul></details>`;
}
function dayDetail(d, { withDate = true } = {}) {
  const s = dayStats(d);
  const metrics = s.v2
    ? `<dl class="metrics">
    <dt>Active</dt><dd class="hero" data-testid="active-minutes">${rangeValue(s.low, s.high)}</dd>
    <dt>Quizzes (measured)</dt><dd data-testid="quiz-line">${fmtMin(d.measured_quiz_minutes || 0)}</dd>
    <dt>Reading</dt><dd data-testid="reading-line">${rangeValue(d.reading_minutes_low || 0, d.reading_minutes_high || 0)}</dd>
  </dl>`
    : `<dl class="metrics">
    <dt>Active</dt><dd class="hero" data-testid="active-minutes">${fmtMin(d.estimated_active_minutes)}</dd>
  </dl>
  <p class="v1-note muted" data-testid="v1-note">estimated from session span</p>`;
  const dateLine = withDate ? `<p class="day-date muted" data-testid="day-date">${esc(d.date)}</p>` : "";
  return `<div class="day-detail" data-testid="day-detail">${dateLine}${metrics}${coursesBlock(d, s.v2)}${sessionsBlock(d)}${subsBlock(d)}</div>`;
}

async function loadDay(date) {
  if (!state.dates.includes(date)) return null;
  if (state.cache.has(date)) return state.cache.get(date);
  try {
    const day = await (await fetch(`data/${date}.json`, { cache: "no-store" })).json();
    state.cache.set(date, day);
    return day;
  } catch { return null; }
}

const FOOTER_PROBE_LIMIT = 14;
// Rev 2026-09-27d (W16): when the window's 7 day files carry no activity day,
// the footer falls back to the newest imported day across the whole store —
// a descending manifest scan, bounded at 14 probes, over manifest-listed
// paths only (the no-404 rule: never probe an unlisted date), reusing
// loadDay's no-store fetch and cache. The em-dash survives only when the
// bounded scan itself finds no activity day.
async function footerStamp(days) {
  const candidates = days.filter((d) => d && d.last_activity_at);
  const latest = candidates.length ? candidates.reduce((a, b) => (a.date > b.date ? a : b)) : null;
  if (latest) return footerHtml(latest);
  // Window quiet: descend the manifest's listed dates (state.dates is sorted
  // ascending — walk it end→start), bounded at 14 probes, reusing loadDay
  // (no-store fetch + cache; unlisted dates are never probed).
  for (let i = state.dates.length - 1, probed = 0; i >= 0 && probed < FOOTER_PROBE_LIMIT; i--, probed++) {
    const day = await loadDay(state.dates[i]);
    if (day && day.last_activity_at) return footerHtml(day);
  }
  return `<p class="stale" data-testid="week-footer">Data last imported —</p>`;
}
function footerHtml(day) {
  return `<p class="stale" data-testid="week-footer">Data last imported ${esc(day.date)} ${esc(fmt12(day.last_activity_at))} ET</p>`;
}

async function loadToday() {
  const date = todayEt();
  const res = await fetch(`data/${date}.json`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const day = await res.json();
  state.cache.set(date, day);
  return day;
}

// The live layer: date, status (the single aria-live region), refresh, empty
// state. Rendered inside the in-list Today card when the window is the current
// week, or inside the pinned strip when browsing away (Rev 2026-09-27).
function liveLayer(date, { withDate = true } = {}) {
  return `${withDate ? `<p class="today-date muted" data-testid="today-date">${esc(date)}</p>` : ""}
    <p class="today-status muted" data-testid="today-status" aria-live="polite">${esc(state.todayStatus)}</p>
    <button type="button" data-testid="today-refresh">Refresh</button>`;
}

function renderTodayInCard(date, day) {
  const hasActivity = day && (typeof day.active_minutes_low === "number" || typeof day.estimated_active_minutes === "number");
  const inner = hasActivity
    ? `${liveLayer(date)}${dayDetail(day, { withDate: false })}`
    : `${liveLayer(date)}
    <p class="muted" data-testid="today-empty">No activity recorded for today yet.</p>`;
  const meta = hasActivity ? collapsedMeta(day) : `<span class="chip muted" data-testid="day-empty-chip">No activity</span>`;
  return `<details class="day" data-testid="day-card" open>
    <summary data-testid="day-summary">
      <h3 data-testid="day-title" aria-label="${esc(dayName(date))}">${esc(dayLabel(date))}</h3>
      <span class="chip today-chip" data-testid="day-today">Today</span>
      <span class="day-meta">${meta}</span>
      ${hasActivity ? quizBadge(day) : ""}
    </summary>
    <div class="today-wrap" data-testid="today">${inner}</div>
  </details>`;
}

function renderTodayPinned(date, day) {
  const hasActivity = day && (typeof day.active_minutes_low === "number" || typeof day.estimated_active_minutes === "number");
  const body = hasActivity
    ? dayDetail(day, { withDate: false })
    : `<p class="muted" data-testid="today-empty">No activity recorded for today yet.</p>`;
  return `<section class="today-strip" data-testid="today" aria-labelledby="today-heading">
    <h2 id="today-heading">Today · ${esc(fmtMonthDay(date))}</h2>
    ${liveLayer(date)}
    ${body}
  </section>`;
}

function renderBand(days, dates) {
  const present = days.filter(Boolean);
  let low = 0, high = 0, quizzes = 0;
  const items = [];
  for (const d of present) {
    const s = dayStats(d);
    low += s.low;
    high += s.high;
    for (const sub of d.submissions_and_grades || []) { quizzes++; items.push(sub); }
  }
  const heading = state.anchor === weekStart(todayEt()) ? "This week" : `Week of ${fmtWeekOf(state.anchor)}`;
  const range = `<p class="muted" data-testid="week-range">${esc(fmtWeekRange(dates[0], dates[dates.length - 1]))}</p>`;
  let totals;
  if (!present.length) {
    totals = `<p data-testid="week-empty">No activity logged this week</p>`;
  } else {
    const submissions = items.length
      ? `<details><summary>Show submissions</summary><ul data-testid="week-submissions">${items.map((s) => `<li>Submitted: ${esc(s.item)} — ${esc(s.course)}</li>`).join("")}</ul></details>`
      : "";
    const active = rangeValue(low, high);
    // OQ2 (Rev 2026-09-27d): the current week's denominator counts elapsed
    // days INCLUDING today; past weeks keep the full 7-day window. Future
    // day markers never count as worked.
    const isCurrent = state.anchor === weekStart(todayEt());
    const elapsedDays = isCurrent
      ? Math.min(WINDOW_DAYS, ((dayOfWeek(todayEt()) + 6) % 7) + 1) // Monday-zero index + 1
      : WINDOW_DAYS;
    totals = `<p data-testid="week-worked">Worked ${present.length} of ${elapsedDays} days${isCurrent ? " so far" : ""}</p>
    <p role="group" data-testid="week-active" aria-label="${esc(`Active: ${active}`)}">Active ${active}</p>
    <p data-testid="week-quizzes">Quizzes submitted: ${quizzes}</p>
    ${submissions}`;
  }
  return `<section class="week-band" data-testid="week-band">
    <h2>${heading}</h2>
    ${range}
    ${totals}
  </section>`;
}

function collapsedMeta(d) {
  const s = dayStats(d);
  if (s.v2) {
    if (s.low === 0 && s.high === 0) return "0m active";
    return `≈${fmtMin(mid(s.low, s.high))} active`;
  }
  const est = Math.round(d.estimated_active_minutes);
  if (!est) return "0m active";
  return `≈${fmtMin(quantize5(est))} active`;
}

function quizBadge(d) {
  const quizzes = (d.submissions_and_grades || []).length;
  return quizzes === 0 ? "" : `<span class="badge">${quizzes === 1 ? "Quiz submitted" : `${quizzes} quizzes`}</span>`;
}

function renderActiveDay(d) {
  return `<details class="day" data-testid="day-card">
    <summary data-testid="day-summary">
      <h3 data-testid="day-title" aria-label="${esc(dayName(d.date))}">${esc(dayLabel(d.date))}</h3>
      <span class="day-meta">${collapsedMeta(d)}</span>
      ${quizBadge(d)}
    </summary>
    ${dayDetail(d)}
  </details>`;
}

function renderEmpty(date, today) {
  if (date > today) {
    return `<div class="day future" data-testid="day-card">
    <h3 data-testid="day-title" aria-label="${esc(dayName(date))}">${esc(dayLabel(date))}</h3>
    <span class="chip muted" data-testid="day-future">Not yet</span>
  </div>`;
  }
  return `<div class="day empty" data-testid="day-card">
    <h3 data-testid="day-title" aria-label="${esc(dayName(date))}">${esc(dayLabel(date))}</h3>
    <span class="chip muted" data-testid="day-empty-chip">No activity</span>
  </div>`;
}

function isoOfTitle(el) {
  const title = el.querySelector("[data-testid=day-title]");
  if (!title) return "";
  const label = title.getAttribute("aria-label") || "";
  if (label) return label.split(", ").pop();
  return title.textContent.trim();
}
function captureDisclosure(root) {
  const dayState = {};
  const openSessions = [];
  for (const el of root.querySelectorAll("details.day")) {
    const iso = isoOfTitle(el);
    if (iso) dayState[iso] = el.open;
  }
  for (const el of root.querySelectorAll("details[data-testid=sessions][open]")) {
    const card = el.closest("details.day");
    const iso = card ? isoOfTitle(card) : "";
    if (iso) openSessions.push(iso);
  }
  return { dayState, openSessions };
}
function restoreDisclosure(root, snapshot) {
  for (const el of root.querySelectorAll("details.day")) {
    const iso = isoOfTitle(el);
    if (!iso || !(iso in snapshot.dayState)) continue;
    const want = snapshot.dayState[iso];
    el.open = want;
    if (want) el.setAttribute("open", ""); else el.removeAttribute("open");
    if (snapshot.openSessions.includes(iso)) {
      const nested = el.querySelector("details[data-testid=sessions]");
      if (nested) { nested.open = true; nested.setAttribute("open", ""); }
    }
  }
}
// Focus + scroll survival across re-renders (Rev 2026-09-27, W8): capture the
// focused day's identity, restore the same summary and the scroll offset after
// the innerHTML replacement.
function captureView() {
  const ae = document.activeElement;
  let focus = null;
  if (ae && ae !== document.body && ae.closest) {
    const card = ae.closest("[data-testid=day-card]");
    const title = card && card.querySelector("[data-testid=day-title]");
    if (title) {
      const label = title.getAttribute("aria-label") || "";
      focus = { iso: label ? label.split(", ").pop() : title.textContent.trim(), onSummary: ae.tagName === "SUMMARY" };
    }
  }
  return { focus, scrollY: window.scrollY };
}
function restoreView(root, view) {
  window.scrollTo(0, view.scrollY);
  if (!view.focus) return;
  for (const el of root.querySelectorAll("[data-testid=day-card]")) {
    const title = el.querySelector("[data-testid=day-title]");
    if (!title) continue;
    const label = title.getAttribute("aria-label") || "";
    const iso = label ? label.split(", ").pop() : title.textContent.trim();
    if (iso !== view.focus.iso) continue;
    const target = view.focus.onSummary
      ? el.querySelector("[data-testid=day-summary]")
      : el.querySelector("[data-testid=today-refresh]");
    if (target && target.focus) target.focus({ preventScroll: true });
    break;
  }
}

// Scroll-anchor (Rev 2026-09-27b, W13/W14): on anchor-triggering events only —
// the initial open of the current week and navigation that lands on it
// (Today-jump, picker inside the current week) — the viewport moves to Today's
// in-list card: top edge at the viewport top when the scroll allows, otherwise
// as far down as the document goes (the band and earlier days stay one
// scroll-up away). Renders driven by polls, day-file changes or disclosure
// toggles never call this. Instant jump (plain scrollTo, no smooth behavior),
// so prefers-reduced-motion is respected by construction.
function anchorToToday() {
  const de = document.documentElement;
  if (de.scrollHeight <= de.clientHeight) return; // page fits: nothing to anchor
  const wrap = document.querySelector("[data-testid=day-card] [data-testid=today]");
  const card = wrap && wrap.closest("[data-testid=day-card]");
  if (!card) return;
  const top = card.getBoundingClientRect().top + window.scrollY;
  window.scrollTo(0, Math.max(0, top));
}

async function render({ anchorToday = false } = {}) {
  const root = document.getElementById("days");
  root.setAttribute("aria-busy", "true");
  try {
    const today = todayEt();
    const dates = [];
    for (let i = 0; i < WINDOW_DAYS; i++) dates.push(addDays(state.anchor, i));
    const days = await Promise.all(dates.map(loadDay));
    const inList = dates.includes(today);
    // W16 (Rev 2026-09-27d): the footer stamp is assembled via footerStamp()
    // (window scan first, then the bounded global fallback) and awaited here.
    const footer = await footerStamp(days);
    const dayCards = dates.map((date, i) => {
      const d = days[i];
      if (inList && date === today) return renderTodayInCard(date, d);
      if (d) return renderActiveDay(d);
      return renderEmpty(date, today);
    }).join("");
    const html =
      (inList ? "" : renderTodayPinned(today, state.todayDay)) +
      renderBand(days, dates) +
      `<p class="legend" data-testid="legend">Unmarked durations are estimated from page-open gaps; quizzes are measured.</p>` +
      dayCards +
      footer;
    const snapshot = captureDisclosure(root);
    const view = captureView();
    root.innerHTML = html;
    restoreDisclosure(root, snapshot);
    restoreView(root, view);
    if (anchorToday) anchorToToday();
  } finally {
    root.removeAttribute("aria-busy");
    const prev = document.querySelector("[data-testid=prev-week]");
    const next = document.querySelector("[data-testid=next-week]");
    const picker = document.querySelector("[data-testid=picker]");
    const jump = document.querySelector("[data-testid=today-jump]");
    if (prev) prev.disabled = state.anchor <= state.minAnchor;
    if (next) next.disabled = state.anchor >= state.maxAnchor;
    if (picker) picker.value = state.anchor;
    if (jump) jump.disabled = state.anchor === weekStart(todayEt());
  }
}

function setStatus(text) {
  state.todayStatus = text;
  const el = document.querySelector("[data-testid=today-status]");
  if (el) el.textContent = text;
}

function applyManifest(manifest) {
  const dates = normalizeDates(manifest);
  if (!dates.length || dates.join(",") === state.dates.join(",")) return false;
  state.dates = dates;
  applyBounds();
  return true;
}

async function refresh({ manual = false, manifest = null } = {}) {
  if (state.refreshing) return;
  state.refreshing = true;
  if (manual) setStatus("Checking…");
  try {
    let changed = manifest ? applyManifest(manifest) : false;
    if (!manifest) {
      try {
        changed = applyManifest(await (await fetch("data/index.json", { cache: "no-store" })).json());
      } catch { /* keep the previous manifest view */ }
    }

    const date = todayEt();
    if (state.todayDate !== date) {
      state.todayDate = date;
      state.todayDay = null;
      state.todaySnapshot = null;
      applyBounds();
      changed = true;
    }

    // The retrieval timestamp comes from the pipeline's last API query,
    // never from the page clock.
    state.retrievedAt = await fetchStatus();

    if (!state.dates.includes(date)) {
      // No capture yet for today: render the empty state without probing a
      // file that does not exist (the 404 would be a console error).
      const wasEmpty = state.todayDay === null && state.todaySnapshot === null;
      state.todayDay = null;
      state.todaySnapshot = null;
      state.todayStatus = retrievalText();
      if (changed || !wasEmpty) await render();
      else setStatus(state.todayStatus);
      return;
    }

    const prior = state.todayDay;
    try {
      const day = await loadToday();
      const snapshot = JSON.stringify(day);
      state.todayStatus = retrievalText();
      if (!prior || snapshot !== state.todaySnapshot || changed) {
        state.todayDay = day;
        state.todaySnapshot = snapshot;
        await render();
      } else {
        // Identical content: update the aria-live status in place and leave
        // the DOM (and any focused node) untouched.
        setStatus(state.todayStatus);
      }
    } catch {
      if (prior) {
        setStatus("Showing last loaded data");
      } else {
        state.todayDay = null;
        state.todaySnapshot = null;
        state.todayStatus = "Showing last loaded data";
        await render();
      }
    }
  } finally {
    state.refreshing = false;
  }
}

function stopPolling() {
  if (pollTimer !== null) { clearInterval(pollTimer); pollTimer = null; }
}
function startPolling() {
  stopPolling();
  if (document.visibilityState !== "visible") return;
  pollTimer = setInterval(() => refresh(), pollMs());
}
function onVisibilityChange() {
  if (document.visibilityState === "visible") {
    refresh();
    startPolling();
  } else {
    stopPolling();
  }
}

function normalizeDates(manifest) {
  return manifest
    .map((ref) => String(ref).replace(/^data\//, "").replace(/\.json$/, ""))
    .filter((date) => /^\d{4}-\d{2}-\d{2}$/.test(date))
    .sort();
}
function applyBounds() {
  state.minAnchor = weekStart(state.dates[0]);
  state.maxAnchor = weekStart(todayEt());
  if (state.minAnchor > state.maxAnchor) state.minAnchor = state.maxAnchor;
  const picker = document.querySelector("[data-testid=picker]");
  if (picker) { picker.min = state.minAnchor; picker.max = todayEt(); }
}
function setAnchor(date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  const week = weekStart(date);
  const clamped = week < state.minAnchor ? state.minAnchor : week > state.maxAnchor ? state.maxAnchor : week;
  state.anchor = clamped;
  // Navigation that lands on the current week is an anchor trigger (W13);
  // moving to a past week is not.
  render({ anchorToday: clamped === weekStart(todayEt()) });
}
function bindControls() {
  document.querySelector("[data-testid=prev-week]").addEventListener("click", () => setAnchor(addDays(state.anchor, -WINDOW_DAYS)));
  document.querySelector("[data-testid=next-week]").addEventListener("click", () => setAnchor(addDays(state.anchor, WINDOW_DAYS)));
  const picker = document.querySelector("[data-testid=picker]");
  picker.addEventListener("change", () => setAnchor(picker.value));
  document.querySelector("[data-testid=today-jump]").addEventListener("click", () => setAnchor(todayEt()));
  document.getElementById("days").addEventListener("click", (e) => {
    if (e.target.closest("[data-testid=today-refresh]")) refresh({ manual: true });
  });
  document.addEventListener("visibilitychange", onVisibilityChange);
}

async function main() {
  const root = document.getElementById("days");
  let manifest;
  try {
    manifest = await (await fetch("data/index.json", { cache: "no-store" })).json();
  } catch { root.textContent = "No summary data yet."; return; }
  const dates = normalizeDates(manifest);
  if (!dates.length) { root.textContent = "No summary data yet."; return; }

  state.dates = dates;
  applyBounds();
  state.anchor = state.maxAnchor;
  bindControls();
  await refresh({ manifest });
  anchorToToday(); // initial open of the current week is an anchor trigger (W13)
  startPolling();
}
main();
</script>
</body>
</html>
