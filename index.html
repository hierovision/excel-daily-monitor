<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel Daily Summary</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 1.15rem; }
  .nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .nav button, .nav input { font: inherit; padding: 6px 10px; border: 1px solid #ccc8; border-radius: 8px; background: transparent; }
  .nav button:disabled { opacity: .4; }
  .week-band { border: 1px solid #ccc3; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .week-band h2 { margin: 0 0 6px; font-size: 1rem; }
  .week-band p { margin: 2px 0; font-size: .9rem; }
  .day { border: 1px solid #ccc3; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
  .day summary { cursor: pointer; }
  .day summary h3 { display: inline; margin: 0; font-size: 1rem; }
  .day-meta { font-size: .9rem; }
  .badge { display: inline-block; font-size: .75rem; border: 1px solid #9ac9ec; border-radius: 999px; padding: 1px 8px; color: #225566; }
  .day-detail { margin-top: 6px; font-size: .88rem; }
  .day.empty h3 { display: inline; margin: 0; font-size: 1rem; }
  .range { margin: 6px 0 2px; }
  .muted { color: #6b6b6b; font-size: .8rem; }
  .day.empty .muted { margin-left: 6px; }
  ul { margin: 4px 0 0; padding-left: 18px; font-size: .85rem; }
  .stale { color: #8a4b00; font-size: .8rem; margin-top: 2px; }
  @media (prefers-color-scheme: dark) {
    .muted { color: #b0b0b0; }
    .stale { color: #e0a060; }
    .badge { color: #bcdcf5; border-color: #4a6b86; }
  }
</style>
</head>
<body>
<main>
<h1>Excel High School — Daily Activity</h1>
<nav class="nav" aria-label="Week navigation">
  <button type="button" data-testid="prev-week">← Prev week</button>
  <input type="date" data-testid="picker" aria-label="Show the 7 days ending on">
  <button type="button" data-testid="next-week">Next week →</button>
</nav>
<div id="days"><p class="muted">Loading…</p></div>
</main>
<script>
"use strict";
const WINDOW_DAYS = 7;
const state = { dates: [], anchor: null, minAnchor: null, maxAnchor: null, cache: new Map() };
const addDays = (date, n) => new Date(Date.parse(date + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtMin = (m) => { const h = Math.floor(m / 60); return h > 0 ? `${h}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`; };
const mid = (low, high) => Math.round((low + high) / 2);
const hhmm = (t) => (t ? String(t).slice(0, 5) : "—");

function dayStats(d) {
  if (typeof d.active_minutes_low === "number") {
    return { v2: true, low: d.active_minutes_low, high: d.active_minutes_high };
  }
  return { v2: false, low: d.estimated_active_minutes, high: d.estimated_active_minutes };
}
function rangeText(label, low, high, primary) {
  return low === high
    ? `${label}: about ${fmtMin(low)}`
    : `${label}: about ${fmtMin(primary)} · range ${fmtMin(low)}–${fmtMin(high)}`;
}
function rangeLabel(label, low, high) {
  return low === high
    ? `${label}: ${fmtMin(low)} (estimated)`
    : `${label}: between ${fmtMin(low)} and ${fmtMin(high)} (estimated)`;
}
function rangeLine(testid, label, low, high) {
  return `<p class="range" role="group" data-testid="${testid}" aria-label="${esc(rangeLabel(label, low, high))}">${rangeText(`${label} (estimated)`, low, high, low)}</p>`;
}
function quizLine(d) {
  const m = d.measured_quiz_minutes || 0;
  const n = (d.submissions_and_grades || []).length;
  return `<p class="range" role="group" data-testid="quiz-line" aria-label="${esc(`Quizzes (measured): ${fmtMin(m)}, ${n} submitted`)}">Quizzes (measured): ${fmtMin(m)} · ${n} submitted</p>`;
}
function coursesBlock(d, v2) {
  const courses = d.by_course || [];
  if (!courses.length) return "";
  return `<div data-testid="courses">${courses.map((c) => `
    <p class="course-line" data-testid="course-line">${esc(c.course)} — ${fmtMin(v2 ? c.active_minutes_low : c.estimated_minutes)} active</p>`).join("")}</div>`;
}
function sessionsBlock(d) {
  const sessions = d.sessions || [];
  const items = sessions.length
    ? sessions.map((s) => `<li>${esc(s.start)}–${esc(s.end)}</li>`).join("")
    : "<li>none</li>";
  return `<details data-testid="sessions"><summary>Session times</summary><ul>${items}</ul></details>`;
}
function subsBlock(d) {
  const subs = d.submissions_and_grades || [];
  if (!subs.length) return "";
  return `<ul data-testid="submissions">${subs.map((s) => `<li>Submitted: ${esc(s.item)} — ${esc(s.course)}</li>`).join("")}</ul>`;
}

async function loadDay(date) {
  if (!state.dates.includes(date)) return null;
  if (state.cache.has(date)) return state.cache.get(date);
  try {
    const day = await (await fetch(`data/${date}.json`, { cache: "no-store" })).json();
    state.cache.set(date, day);
    return day;
  } catch { return null; }
}

function renderBand(days) {
  const present = days.filter(Boolean);
  let low = 0, high = 0, quizzes = 0;
  const items = [];
  for (const d of present) {
    const s = dayStats(d);
    low += s.low;
    high += s.high;
    for (const sub of d.submissions_and_grades || []) { quizzes++; items.push(sub); }
  }
  const submissions = items.length
    ? `<details><summary>Show submissions</summary><ul data-testid="week-submissions">${items.map((s) => `<li>Submitted: ${esc(s.item)} — ${esc(s.course)}</li>`).join("")}</ul></details>`
    : "";
  return `<section class="week-band" data-testid="week-band" aria-live="polite">
    <h2>This week</h2>
    <p data-testid="week-worked">Worked ${present.length} of ${WINDOW_DAYS} days</p>
    <p role="group" data-testid="week-active" aria-label="${esc(rangeLabel("Active", low, high))}">${rangeText("Active (estimated)", low, high, mid(low, high))}</p>
    <p data-testid="week-quizzes">Quizzes submitted: ${quizzes}</p>
    ${submissions}
  </section>`;
}

function renderActiveDay(d) {
  const s = dayStats(d);
  const quizzes = (d.submissions_and_grades || []).length;
  const badge = quizzes === 0 ? "" : `<span class="badge">${quizzes === 1 ? "Quiz submitted" : `${quizzes} quizzes`}</span>`;
  const meta = s.v2
    ? `about ${fmtMin(mid(s.low, s.high))} active`
    : `about ${d.estimated_active_minutes}m active`;
  const active = s.v2
    ? rangeLine("active-minutes", "Active", s.low, s.high)
    : `<p class="range" data-testid="active-minutes">${d.estimated_active_minutes} min active (span ${d.span_minutes} min)</p>`;
  const detail = (s.v2
    ? active + quizLine(d) + rangeLine("reading-line", "Reading", d.reading_minutes_low, d.reading_minutes_high)
    : active) +
    coursesBlock(d, s.v2) + sessionsBlock(d) +
    `<p class="range" data-testid="first-last">First to last activity: ${esc(hhmm(d.first_activity_at))}–${esc(hhmm(d.last_activity_at))}</p>` +
    subsBlock(d);
  return `<details class="day" data-testid="day-card">
    <summary data-testid="day-summary">
      <h3 data-testid="day-title">${esc(d.date)}</h3>
      <span class="day-meta">${meta}</span>
      ${badge}
    </summary>
    <div class="day-detail">
      ${detail}
    </div>
  </details>`;
}

function renderEmpty(date) {
  return `<div class="day empty" data-testid="day-card">
    <h3 data-testid="day-title">${date}</h3>
    <span class="muted">no activity</span>
  </div>`;
}

async function render() {
  const root = document.getElementById("days");
  root.setAttribute("aria-busy", "true");
  const dates = [];
  for (let i = 0; i < WINDOW_DAYS; i++) dates.push(addDays(state.anchor, -i));
  const days = await Promise.all(dates.map(loadDay));
  const latest = days.find((d) => d && d.last_activity_at);
  const footer = latest
    ? `<p class="stale" data-testid="week-footer">Data as of ${esc(latest.date)} ${esc(hhmm(latest.last_activity_at))}</p>`
    : `<p class="stale" data-testid="week-footer">Data as of —</p>`;
  root.innerHTML = renderBand(days) + days.map((d, i) => d ? renderActiveDay(d) : renderEmpty(dates[i])).join("") + footer;
  root.removeAttribute("aria-busy");
  document.querySelector("[data-testid=prev-week]").disabled = state.anchor <= state.minAnchor;
  document.querySelector("[data-testid=next-week]").disabled = state.anchor >= state.maxAnchor;
  document.querySelector("[data-testid=picker]").value = state.anchor;
}

function setAnchor(date) {
  const clamped = date < state.minAnchor ? state.minAnchor : date > state.maxAnchor ? state.maxAnchor : date;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(clamped)) return;
  state.anchor = clamped;
  render();
}

async function main() {
  const root = document.getElementById("days");
  let manifest;
  try {
    manifest = await (await fetch("data/index.json", { cache: "no-store" })).json();
  } catch { root.textContent = "No summary data yet."; return; }
  const dates = manifest
    .map((ref) => String(ref).replace(/^data\//, "").replace(/\.json$/, ""))
    .filter((date) => /^\d{4}-\d{2}-\d{2}$/.test(date))
    .sort();
  if (!dates.length) { root.textContent = "No summary data yet."; return; }

  state.dates = dates;
  state.maxAnchor = dates[dates.length - 1];
  state.minAnchor = addDays(dates[0], WINDOW_DAYS - 1);
  if (state.minAnchor > state.maxAnchor) state.minAnchor = state.maxAnchor;
  state.anchor = state.maxAnchor;

  const picker = document.querySelector("[data-testid=picker]");
  picker.min = state.minAnchor;
  picker.max = state.maxAnchor;
  document.querySelector("[data-testid=prev-week]").addEventListener("click", () => setAnchor(addDays(state.anchor, -WINDOW_DAYS)));
  document.querySelector("[data-testid=next-week]").addEventListener("click", () => setAnchor(addDays(state.anchor, WINDOW_DAYS)));
  picker.addEventListener("change", () => setAnchor(picker.value));
  await render();
}
main();
</script>
</body>
</html>
