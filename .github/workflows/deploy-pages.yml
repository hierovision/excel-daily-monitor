name: deploy-pages
on:
  push:
    branches: [main]
  workflow_run:
    # Data commits are pushed with the workflow's GITHUB_TOKEN, and GitHub does
    # not trigger `push` workflows from those. Catch them via the scrape
    # workflow's completion (success-only guard on the job).
    workflows: [daily-summary]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Human pushes and manual dispatch deploy directly; daily-summary
    # completions deploy only after a successful run (a failed scrape commits
    # nothing, so there is nothing new to publish).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
