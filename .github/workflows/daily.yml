name: daily-summary
on:
  schedule:
    - cron: "0 13 * * *" # ~6-7am America/Chicago
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/*.json back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Scrape (credentials are secrets; never echoed)
        env:
          EXCEL_USERNAME: ${{ secrets.EXCEL_USERNAME }}
          EXCEL_PASSWORD: ${{ secrets.EXCEL_PASSWORD }}
        run: node scrape.js
      - name: Summarize
        run: node summarize.js data/raw-events.json
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrape-failure
          # trace.zip stays on the runner: traces embed full URLs/network bodies.
          path: |
            data/failure/failure.json
            data/failure/failure.png
            data/failure/page.html
            data/failure/console.log
            data/failure/feed.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit data (no-op when unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "no changes" || git commit -m "daily summary $(date -u +%F)"
          git push

  deploy:
    needs: scrape-and-commit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
