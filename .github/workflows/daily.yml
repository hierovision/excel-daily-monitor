name: daily-summary
on:
  schedule:
    # 07:00 UTC = 3am America/New_York during EDT (2am EST in winter — cron is
    # UTC-only, so the local hour shifts by an hour across DST; both precede a
    # ~4:45am wake-up).
    - cron: "0 7 * * *"
    # Intraday refresh every 15 minutes, 09:00–21:00 ET. Cron is UTC-only, so
    # the window is the union of both DST regimes: 13:00–02:45 UTC =
    # 09:00–22:45 EDT / 08:00–21:45 EST.
    - cron: "*/15 13-23,0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The image ships Chromium and the OS dependencies, so this job never runs
    # apt. The tag and digest must match the exact Playwright version in
    # package.json/package-lock.json (1.63.0); the guard step below fails on
    # drift. `ubuntu-24.04` only hosts Docker — the image digest is the
    # reproducibility boundary for the browser environment.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --ipc=host
    # GitHub runs container jobs with `sh`; keep the existing bash semantics.
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: "1.63.0"
    permissions:
      contents: write # commit data/*.json back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - name: Verify Playwright version matches the container image
        run: |
          installed="$(npx playwright --version | awk '{print $2}')"
          if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::Playwright $installed does not match the container's $PLAYWRIGHT_VERSION"
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Scrape (credentials are secrets; never echoed)
        env:
          EXCEL_USERNAME: ${{ secrets.EXCEL_USERNAME }}
          EXCEL_PASSWORD: ${{ secrets.EXCEL_PASSWORD }}
        run: node scrape.js
      - name: Summarize
        run: node summarize.js data/raw-events.json
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrape-failure
          # trace.zip stays on the runner: traces embed full URLs/network bodies.
          # console.log / network.log stay on the runner too: this repository is
          # public, so their URLs and request bodies would be published as
          # artifacts (2026-11-03 security pass).
          path: |
            data/failure/failure.json
            data/failure/*.png
            data/failure/*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit data (no-op when unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "daily summary $(date -u +%F)"
          # `main` is protected by a ruleset (no force-push, no deletion). This
          # normal fast-forward data commit is the deployment path; do not add a
          # PR requirement without changing this workflow. The GitHub Actions
          # integration cannot be a ruleset bypass actor on this personal repo.
          # A concurrent run may have pushed between checkout and push; rebase
          # (keeping our status timestamp on conflict) and retry.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; rebasing onto origin/main and retrying ($i/3)"
            git pull --rebase -X ours origin main
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1
