name: daily-summary
on:
  schedule:
    # 07:00 UTC = 3am America/New_York during EDT (2am EST in winter — cron is
    # UTC-only, so the local hour shifts by an hour across DST; both precede a
    # ~4:45am wake-up).
    - cron: "0 7 * * *"
    # Intraday refresh every 15 minutes, 09:00–21:00 ET. Cron is UTC-only, so
    # the window is the union of both DST regimes: 13:00–02:45 UTC =
    # 09:00–22:45 EDT / 08:00–21:45 EST.
    - cron: "*/15 13-23,0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/*.json back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Scrape (credentials are secrets; never echoed)
        env:
          EXCEL_USERNAME: ${{ secrets.EXCEL_USERNAME }}
          EXCEL_PASSWORD: ${{ secrets.EXCEL_PASSWORD }}
        run: node scrape.js
      - name: Summarize
        run: node summarize.js data/raw-events.json
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrape-failure
          # trace.zip stays on the runner: traces embed full URLs/network bodies.
          path: |
            data/failure/failure.json
            data/failure/*.png
            data/failure/*.html
            data/failure/console.log
            data/failure/network.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit data (no-op when unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "daily summary $(date -u +%F)"
          # A concurrent run may have pushed between checkout and push; rebase
          # (keeping our status timestamp on conflict) and retry.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; rebasing onto origin/main and retrying ($i/3)"
            git pull --rebase -X ours origin main
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1
